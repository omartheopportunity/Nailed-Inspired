<script>
  // Fire CompletePayment once per real Stripe checkout (Stripe adds ?session_id=... on redirect)
  (function(){
    var id=new URLSearchParams(location.search).get('session_id');
    if(!id || !window.ttq) return;
    try{ if(localStorage.getItem('ni_paid_'+id)) return; localStorage.setItem('ni_paid_'+id,'1'); }catch(e){}
    ttq.track('CompletePayment',{contents:[{content_id:'next-chapter-bundle',content_type:'product',content_name:'The Next Chapter Bundle'}],value:25,currency:'USD'},{event_id:id});
