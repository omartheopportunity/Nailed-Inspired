<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Become Her — Nailed & Inspired</title>
<meta name="description" content="Weekly reset texts, confidence tips & women-only events from Nailed & Inspired.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Jost:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root {
    --ni-plum: #3B1F2B;
    --ni-plum-deep: #241318;
    --ni-blush: #F4D9D0;
    --ni-cream: #FBF3EC;
    --ni-gold: #B98B4E;
    --ni-rose: #C97B84;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background: var(--ni-blush);
    font-family: 'Jost', 'Helvetica Neue', Arial, sans-serif;
    color: var(--ni-plum-deep);
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1rem;
  }

  .ni-page {
    width: 100%;
    max-width: 640px;
    text-align: center;
  }

  .ni-page__wordmark {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-style: italic;
    font-size: 1.1rem;
    color: var(--ni-plum);
    margin: 0 0 2rem;
    letter-spacing: 0.02em;
  }

  .ni-form-wrap {
    background: var(--ni-cream);
    border: 1px solid rgba(59, 31, 43, 0.14);
    border-radius: 2px;
    padding: 2.5rem 1.75rem 2rem;
    position: relative;
  }

  .ni-form-wrap::before {
    content: "";
    position: absolute;
    inset: 8px;
    border: 1px solid rgba(185, 139, 78, 0.35);
    border-radius: 1px;
    pointer-events: none;
  }

  .ni-form-wrap__mark {
    color: var(--ni-gold);
    display: flex;
    justify-content: center;
    margin-bottom: 0.9rem;
  }

  .ni-form-wrap__eyebrow {
    margin: 0 0 0.5rem;
    font-size: 0.85rem;
    color: var(--ni-rose);
    font-style: italic;
  }

  .ni-form-wrap__headline {
    margin: 0 0 0.6rem;
    font-family: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
    font-weight: 600;
    font-size: clamp(1.8rem, 4vw, 2.3rem);
    line-height: 1.2;
    color: var(--ni-plum);
  }

  .ni-form-wrap__sub {
    margin: 0 auto 1.75rem;
    max-width: 40ch;
    font-size: 1rem;
    line-height: 1.55;
    color: rgba(36, 19, 24, 0.75);
  }

  .ni-form-wrap__frame {
    background: #fff;
    border: 1px solid rgba(59, 31, 43, 0.16);
    border-radius: 2px;
    overflow: hidden;
  }

  .ni-form-wrap__frame iframe {
    display: block;
    width: 100%;
    height: 480px;
    border: none;
  }

  .ni-page__footer {
    margin-top: 1.5rem;
    font-size: 0.8rem;
  }

  .ni-page__footer a {
    color: var(--ni-plum);
  }

  @media (max-width: 480px) {
    .ni-form-wrap { padding: 2rem 1.1rem 1.5rem; }
    .ni-form-wrap__frame iframe { height: 560px; }
  }
</style>
</head>
<body>

<div class="ni-page">
  <p class="ni-page__wordmark">Nailed &amp; Inspired</p>

  <div class="ni-form-wrap">
    <div class="ni-form-wrap__mark" aria-hidden="true">
      <svg viewBox="0 0 48 48" width="30" height="30">
        <circle cx="24" cy="24" r="23" fill="none" stroke="currentColor" stroke-width="1.4"/>
        <path d="M24 14c-3.2 4-3.2 8 0 12M24 14c3.2 4 3.2 8 0 12" fill="none" stroke="currentColor" stroke-width="1.2"/>
      </svg>
    </div>
    <p class="ni-form-wrap__eyebrow">Nailing your look is step one.</p>
    <h1 class="ni-form-wrap__headline">Become Her — join the list</h1>
    <p class="ni-form-wrap__sub">Weekly reset texts, confidence tips &amp; women-only events. Takes ten seconds.</p>

    <div class="ni-form-wrap__frame">
      <iframe
        src="https://docs.google.com/forms/d/e/1FAIpQLScaRp7c8Dq9OM95y7LGGnfcZgg_N36X4Lp9BXGxtTaBp4M3Mg/viewform?embedded=true"
        title="Becoming Her — email signup"
      >Loading…</iframe>
    </div>
  </div>

  <p class="ni-page__footer"><a href="/">← Back to Nailed &amp; Inspired</a></p>
</div>

</body>
</html>
